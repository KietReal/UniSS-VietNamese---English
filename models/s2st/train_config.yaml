# Training 
training:
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 4  
  max_grad_norm: 1.0
  mixed_precision: "fp16"  
  num_workers: 8
  seed: 75

# Optimizer 
optimizer:
  type: AdamW8bit 
  lr: 0.0002
  weight_decay: 0.02
  betas: [0.9, 0.999]
  eps: 0.00000001

# Scheduler 
scheduler:
  warmup_ratio: 0.1
  min_lr: 0.00005

# Loss 
loss:
  label_smoothing: 0.1

# WandB
wandb:
  project: "S2ST-Phase2"
  run_name: "phase2-multitask-v1"
  mode: "online"  

# Data 
data:
  train_csv:
    - "data/train.csv"
  valid_csv:
    - "data/valid.csv"
  sample_rate: 16000

# Paths 
paths:
  envit5: "models/checkpoints/envit5-translation"
  sparktts: "models/checkpoints/Spark-TTS-0.5B"
  checkpoint_dir_1: "models/checkpoints/phase1"
  checkpoint_dir_2: "models/checkpoints/phase2"
